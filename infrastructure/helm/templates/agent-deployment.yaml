{{- if .Values.agent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "financial-ai-agent.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "financial-ai-agent.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.agent.serviceAccount.roleArn | default "arn:aws:iam::ACCOUNT_ID:role/financial-ai-agent" }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "financial-ai-agent.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "financial-ai-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  annotations:
    checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
spec:
  replicas: {{ .Values.agent.replicaCount | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "financial-ai-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "financial-ai-agent.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: agent
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "financial-ai-agent.fullname" . }}-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # ── FIX: initContainers gate startup on real dependency readiness ──────
      # Without these, agent tries DB connection at startup while pgvector-0
      # is still in Init:CrashLoopBackOff → guaranteed CrashLoopBackOff cascade.
      # These are lightweight busybox loops — they add <2s on a warm cluster.
      initContainers:
        - name: wait-for-pgvector
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for pgvector at {{ include "financial-ai-agent.fullname" . }}-pgvector:5432 ..."
              until nc -z {{ include "financial-ai-agent.fullname" . }}-pgvector 5432; do
                echo "pgvector not ready — sleeping 3s"
                sleep 3
              done
              echo "pgvector is ready"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]

        - name: wait-for-redis
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for redis at {{ include "financial-ai-agent.fullname" . }}-redis:6379 ..."
              until nc -z {{ include "financial-ai-agent.fullname" . }}-redis 6379; do
                echo "redis not ready — sleeping 3s"
                sleep 3
              done
              echo "redis is ready"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]

      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy | default "IfNotPresent" }}

          ports:
            - name: health
              containerPort: 8001
              protocol: TCP

          env:
            - name: AGENT_CONCURRENCY
              value: {{ .Values.agent.concurrency | default "4" | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | default "info" | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.global.environment | quote }}

          envFrom:
            - secretRef:
                name: financial-ai-secrets

          resources:
            requests:
              cpu: {{ .Values.agent.resources.requests.cpu | default "500m" }}
              memory: {{ .Values.agent.resources.requests.memory | default "1Gi" }}
            limits:
              cpu: {{ .Values.agent.resources.limits.cpu | default "2000m" }}
              memory: {{ .Values.agent.resources.limits.memory | default "2Gi" }}

          startupProbe:
            httpGet:
              path: /health
              port: health
            failureThreshold: 12
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model-cache
              mountPath: /app/.cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: model-cache
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.agent.modelCacheSize | default "500Mi" }}

      # Spread across nodes to avoid single-node failure
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "financial-ai-agent.name" . }}
              app.kubernetes.io/component: agent

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "financial-ai-agent.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "financial-ai-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "financial-ai-agent.fullname" . }}-agent
  minReplicas: {{ .Values.agent.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ .Values.agent.autoscaling.maxReplicas | default 8 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.agent.autoscaling.targetCPU | default 65 }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.agent.autoscaling.targetMemory | default 75 }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
{{- end }}
