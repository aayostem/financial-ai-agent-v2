{{- if not .Values.secrets.useExternalSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: financial-ai-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: financial-ai-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.db | quote }}
  POSTGRES_HOST: {{ include "financial-ai-agent.postgresHost" . | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:%s/%s" .Values.postgres.user .Values.postgres.password (include "financial-ai-agent.postgresHost" .) (.Values.postgres.port | toString) .Values.postgres.db | quote }}
  REDIS_HOST: {{ include "financial-ai-agent.fullname" . }}-redis
  REDIS_PORT: {{ .Values.redisConfig.port | quote }}
  REDIS_PASSWORD: {{ .Values.redisConfig.password | quote }}
  REDIS_DB: {{ .Values.redisConfig.db | quote }}
  LLM_PROVIDER: "local"
{{- end }}